# ── Netlify Configuration for EWU CGPA Calculator ──

[build]
  publish = "."

# Cache HTML short (always fresh for crawlers), assets long
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www → non-www (canonical)
[[redirects]]
  from = "https://www.ewucgpa.netlify.app/*"
  to   = "https://ewucgpa.netlify.app/:splat"
  status = 301
  force  = true
